# Passed directly to WanDiffusionWrapper(**model_kwargs).
model_kwargs:
  model_name: Wan2.2-TI2V-5B
  timestep_shift: 5.0
  num_frame_per_block: 8
  local_attn_size: 32

use_ema: false
output_folder: videos/longlive2
num_samples: 1
save_latents_only: false

data:
  data_path: /path/to/longlive2/inference_prompts
  # Latent tensor shape [B, F, C, H, W]. F is also the default number of
  # generated latent frames unless num_output_frames is provided.
  image_or_video_shape:
  - 1
  - 128
  - 48
  - 44
  - 80

inference:
  sampling_steps: 4
  sink_size: 8
  guidance_scale: 1.0
  multi_shot_sink: true
  multi_shot_rope_offset: 8
  streaming_vae: false
  async_vae: false
  vae_type: wan # wan, mg_lightvae, mg_lightvae_v2
  vae_device: "cuda:2"

checkpoints:
  generator_ckpt: /path/to/LongLive-2.0-5B/model_bf16.pt
  lora_ckpt: null

# SpecAR: the 4-step generator generates `k` blocks spread evenly over the video, the 2-step generator
# (LongLive-2.0-5B-NVFP4-S2/model_te.pt, BF16) generates the rest, through one shared KV cache.
# Needs `pip install "specar @ git+https://github.com/statite-ai/SpecAR"`. Remove the section for stock inference.
specar:
  drafter_ckpt: /path/to/LongLive-2.0-5B-NVFP4-S2/model_te.pt
  k: 2
  kv_mode: shared

logging:
  seed: 0
